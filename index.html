<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PQ360 — Parliamentary Question Draft Generator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@govtechsg/sgds@2.2.0/css/sgds.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    .page { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ══════════════════════════════════════════════════════════
       HERO
    ══════════════════════════════════════════════════════════ */
    .hero {
      background: linear-gradient(150deg, #1e1b4b 0%, #312e81 32%, #4f46e5 66%, #6366f1 100%);
      padding: 48px 48px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .hero::before {                                  /* top-right glow */
      content: ''; position: absolute;
      top: -140px; right: -60px;
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(167,139,250,0.18) 0%, transparent 68%);
      pointer-events: none;
    }
    .hero::after {                                   /* bottom-left glow */
      content: ''; position: absolute;
      bottom: -100px; left: 18%;
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 68%);
      pointer-events: none;
    }

    .hero-inner {
      max-width: 800px; width: 100%;
      display: flex; flex-direction: column; gap: 18px;
      text-align: center;
      position: relative; z-index: 1;
    }

    /* Headline */
    .hero-title {
      color: white; font-size: 2.5rem; font-weight: 900;
      letter-spacing: -0.045em; line-height: 1.12;
    }
    .hero-title .gold {
      background: linear-gradient(130deg, #bae6fd, #38bdf8, #0ea5e9);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-sub {
      color: rgba(255,255,255,0.6);
      font-size: 1.0625rem; line-height: 1.7;
      margin: 0 auto; max-width: 660px;
    }

    /* ══════════════════════════════════════════════════════════
       FORM SECTION
    ══════════════════════════════════════════════════════════ */
    .form-section {
      flex: 1; overflow: hidden; background: var(--bg);
      display: flex; flex-direction: column; align-items: center;
      padding: 32px 24px 40px;
    }
    .form-inner {
      width: 100%; max-width: 900px;
      flex: 1; display: flex; flex-direction: column;
    }

    .form-head {
      text-align: center; margin-bottom: 24px;
    }
    .form-head h2 {
      font-size: 1.875rem; font-weight: 900;
      color: var(--text); letter-spacing: -0.03em; margin-bottom: 12px;
    }
    .form-head p {
      font-size: 1.0625rem; color: var(--text-muted); line-height: 1.7;
    }

    /* Textarea card */
    .ta-card {
      background: white; border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden; margin-bottom: 24px;
      transition: border-color 0.2s, box-shadow 0.2s;
      flex: 1; display: flex; flex-direction: column;
    }
    .ta-card:focus-within {
      border-color: var(--primary-mid);
      box-shadow: 0 0 0 5px rgba(79,70,229,0.12), var(--shadow-md);
    }
    .ta-bar {
      display: flex; align-items: center; gap: 7px;
      padding: 14px 20px;
      background: var(--surface-2); border-bottom: 1.5px solid var(--border);
    }
    .ta-dot  { width: 11px; height: 11px; border-radius: 50%; }
    .ta-file {
      font-size: 0.875rem; color: var(--text-faint); font-weight: 500;
      margin-left: 8px; display: flex; align-items: center; gap: 5px;
    }
    #pqInput {
      width: 100%; flex: 1; min-height: 0;
      padding: 26px 24px;
      border: none; outline: none; resize: none;
      font-family: inherit; font-size: 1.0625rem; line-height: 1.85;
      color: var(--text); background: white;
      overflow-y: auto;
    }
    #pqInput::placeholder { color: #818cf8; opacity: 0.5; } /* decorative */
    .ta-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface-2); border-top: 1.5px solid var(--border);
    }
    .char-count { font-size: 0.875rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }

    /* Submit */
    .submit-zone {
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .privacy-note {
      font-size: 0.9375rem; color: var(--text-faint);
      display: flex; align-items: center; gap: 6px;
    }
    .privacy-note i { color: var(--success); }
  </style>
</head>
<body>
<div class="page">

  <!-- Shared header -->
  <header class="pq-header">
    <a href="index_02.html" class="logo">
      <div class="logo-mark">PQ</div>
      <div>
        <div class="logo-text">PQ360</div>
      </div>
    </a>
  </header>

  <!-- ══ HERO ═══════════════════════════════════════════════════════ -->
  <section class="hero" aria-label="How PQ360 works">
    <div class="hero-inner">
      <div>
        <h1 class="hero-title">
          Parliamentary responses, 
          <p><span class="gold">powered by AI agents.</span>
          </p>
        </h1>
        <p class="hero-sub">
          Four specialised agents research in parallel across Hansard, press releases, and other sources — then plan and draft a high-quality response.
        </p>
      </div>
    </div>
  </section>

  <!-- ══ FORM ════════════════════════════════════════════════════════ -->
  <main class="form-section">
    <div class="form-inner">

      <div class="form-head">
        <h2>Enter your Parliamentary Question</h2>
      </div>
      <div class="ta-card">
        <div class="ta-bar">
          <div class="ta-dot" style="background:#ff5f57;"></div>
          <div class="ta-dot" style="background:#ffbd2e;"></div>
          <div class="ta-dot" style="background:#28c840;"></div>
          <div class="ta-file">
          </div>
        </div>
        <textarea id="pqInput" aria-label="Parliamentary Question input"
          placeholder="Example:
Mr Saktiandi Supaat: To ask the Minister for Digital Development and Information...

You may also include supporting context, background notes, or any additional material relevant to drafting the response."></textarea>
        <div class="ta-footer">
        </div>
      </div>

      <div class="submit-zone">
        <button class="btn-accent" onclick="handleSubmit()"
          style="font-size:1.125rem;padding:17px 56px;border-radius:var(--radius);">
          <i class="bi bi-stars" aria-hidden="true"></i>
          Generate AI Draft
        </button>
      </div>

    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script>
const textarea  = document.getElementById('pqInput');
const charCount = document.getElementById('charCount');

textarea.addEventListener('input', () => {
  charCount.textContent = `${textarea.value.length.toLocaleString()} characters`;
});

function handleSubmit() {
  const pq = textarea.value.trim();
  if (!pq) {
    textarea.style.background = '#eef2ff';
    setTimeout(() => textarea.style.background = '', 1400);
    textarea.focus();
    return;
  }
  localStorage.setItem('pq360_input', pq);
  window.location.href = 'loading.html';
}

textarea.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) handleSubmit();
});
</script>
</body>
</html>
